name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libimobiledevice libplist pkg-config cmake

      - name: Build
        run: make compile mac

      - name: Test
        run: python3 tests/test_zerosign.py

  check-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake curl zlib1g-dev

      - name: Build
        run: make compile linux

      - name: Test
        run: python3 tests/test_zerosign.py

  check-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            perl
            curl
            tar
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-libimobiledevice
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-libusbmuxd
            mingw-w64-ucrt-x86_64-zlib

      - name: Build
        run: mingw32-make compile win

      - name: Test
        run: python3 tests/test_zerosign.py
