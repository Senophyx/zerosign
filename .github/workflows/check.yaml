name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libimobiledevice libplist pkg-config cmake

      - name: Restore static dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}
          # A Makefile edit must not throw away a working OpenSSL build, so the
          # newest cache for this OS is restored and make fills in the rest.
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Build static dependencies
        run: make deps

      # Saved even when the build fails, because make leaves a stamp for every
      # library it finished, so a partial prefix still skips those next time.
      - name: Save static dependencies
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build
        run: make compile mac

      - name: Test
        run: python3 tests/test_zerosign.py

  check-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake curl zlib1g-dev

      - name: Restore static dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}
          # A Makefile edit must not throw away a working OpenSSL build, so the
          # newest cache for this OS is restored and make fills in the rest.
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Build static dependencies
        run: make deps

      # Saved even when the build fails, because make leaves a stamp for every
      # library it finished, so a partial prefix still skips those next time.
      - name: Save static dependencies
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build
        run: make compile linux

      - name: Test
        run: python3 tests/test_zerosign.py

  check-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            perl
            curl
            tar
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib

      - name: Restore static dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}
          # A Makefile edit must not throw away a working OpenSSL build, so the
          # newest cache for this OS is restored and make fills in the rest.
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Build static dependencies
        run: mingw32-make deps

      # Saved even when the build fails, because make leaves a stamp for every
      # library it finished, so a partial prefix still skips those next time.
      - name: Save static dependencies
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build
        run: mingw32-make compile win

      - name: Test
        run: python3 tests/test_zerosign.py
