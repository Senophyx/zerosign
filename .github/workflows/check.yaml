name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install openssl@3 libimobiledevice libplist libzip pkg-config

      - name: Build
        run: make compile mac

      - name: Run csign
        run: ./csign --version

  check-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libimobiledevice-dev libplist-dev libzip-dev zlib1g-dev

      - name: Build
        run: make compile linux

      - name: Run csign
        run: ./csign --version

  check-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libimobiledevice
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-zlib

      - name: Build
        run: mingw32-make compile win

      - name: Run csign
        run: ./csign.exe --version
