name: Compile

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libimobiledevice libplist pkg-config cmake

      - name: Build
        run: make compile mac

      - name: Verify
        run: ./zerosign --version

      - name: Verify zero dependencies
        run: |
          otool -L ./zerosign
          if otool -L ./zerosign | grep -E '/opt/homebrew|/usr/local'; then
            echo "::error::zerosign links a library outside the base system"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerosign-macos
          path: ./zerosign

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake curl zlib1g-dev

      - name: Build
        run: make compile linux

      - name: Verify
        run: ./zerosign --version

      - name: Verify zero dependencies
        run: |
          ldd ./zerosign
          if ldd ./zerosign | grep -E 'lib(imobiledevice|plist|zip|crypto|ssl|usbmuxd|glue|zstd|bz2|lzma|z)\.so'; then
            echo "::error::zerosign links a third-party shared library"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerosign-linux
          path: ./zerosign

  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            perl
            curl
            tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-libimobiledevice
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-libusbmuxd
            mingw-w64-ucrt-x86_64-zlib

      - name: Build
        run: mingw32-make compile win

      - name: Verify
        run: ./zerosign.exe --version

      - name: Verify zero dependencies
        run: |
          ldd ./zerosign.exe
          if ldd ./zerosign.exe | grep -Ei '/(ucrt64|mingw64|clang64)/'; then
            echo "::error::zerosign.exe links a toolchain DLL"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerosign-windows
          path: ./zerosign.exe
