name: Compile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install openssl@3 libimobiledevice libplist libzip pkg-config

      - name: Build
        run: make compile mac

      - name: Verify
        run: ./csign --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: csign-macos
          path: ./csign

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libimobiledevice-dev libplist-dev libzip-dev zlib1g-dev

      - name: Build
        run: make compile linux

      - name: Verify
        run: ./csign --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: csign-linux
          path: ./csign

  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libimobiledevice
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-zlib

      - name: Build
        run: mingw32-make compile win

      - name: Bundle runtime libraries
        run: |
          mkdir -p dist/ossl-modules
          cp csign.exe dist/
          ldd csign.exe | grep '/ucrt64/bin/' | awk '{print $3}' | sort -u | while read -r dll; do
            cp "$dll" dist/
          done
          # The legacy provider is loaded at run time for older .p12 files.
          cp /ucrt64/lib/ossl-modules/legacy.dll dist/ossl-modules/ 2>/dev/null || true
          cp /ucrt64/lib/ossl-modules/legacy.dll dist/ 2>/dev/null || true
          if [ -z "$(ls dist/*.dll 2>/dev/null)" ]; then
            echo "::error::no runtime DLLs were bundled"
            exit 1
          fi
          ls -1 dist/

      - name: Verify standalone
        shell: pwsh
        run: |
          $env:PATH = "$PWD\dist"
          $output = & .\dist\csign.exe --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "csign.exe failed to start: missing runtime DLL?"
            exit 1
          }
          Write-Host $output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: csign-windows
          path: dist/
