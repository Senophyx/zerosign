name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libimobiledevice libplist pkg-config cmake

      - name: Restore static dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Build static dependencies
        run: make deps

      - name: Save static dependencies
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build
        run: make compile mac

      - name: Test
        run: python3 tests/test_zerosign.py

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zerosign-macos
          path: ./zerosign

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake curl patch zlib1g-dev

      - name: Restore static dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Build static dependencies
        run: make deps

      - name: Save static dependencies
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build
        run: make compile linux

      - name: Test
        run: python3 tests/test_zerosign.py

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zerosign-linux
          path: ./zerosign

  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            perl
            curl
            tar
            patch
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib

      - name: Restore static dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Build static dependencies
        run: mingw32-make deps

      - name: Save static dependencies
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build
        run: mingw32-make compile win

      - name: Test
        run: python3 tests/test_zerosign.py

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zerosign-windows
          path: ./zerosign.exe
