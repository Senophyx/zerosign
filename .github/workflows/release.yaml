name: Publish
run-name: 'Publish version ${{ inputs.version }}'

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libimobiledevice libplist pkg-config cmake

      - name: Build
        run: make compile mac

      - name: Verify zero dependencies
        run: |
          otool -L ./zerosign
          if otool -L ./zerosign | grep -E '/opt/homebrew|/usr/local'; then
            echo "::error::zerosign links a library outside the base system"
            exit 1
          fi

      - name: Verify version
        run: |
          expected="${RELEASE_VERSION#v}"
          actual="$(./zerosign --version | awk '{print $2}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::zerosign reports $actual but $expected was requested"
            exit 1
          fi
          echo "verified zerosign $actual"

      - name: Package
        run: tar -czf "zerosign-${RELEASE_VERSION}-macos.tar.gz" zerosign

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerosign-macos
          path: zerosign-${{ inputs.version }}-macos.tar.gz

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake curl patch zlib1g-dev

      - name: Build
        run: make compile linux

      - name: Verify zero dependencies
        run: |
          ldd ./zerosign
          if ldd ./zerosign | grep -E 'lib(imobiledevice|plist|zip|crypto|ssl|usbmuxd|glue|zstd|bz2|lzma|z)\.so'; then
            echo "::error::zerosign links a third-party shared library"
            exit 1
          fi

      - name: Verify version
        run: |
          expected="${RELEASE_VERSION#v}"
          actual="$(./zerosign --version | awk '{print $2}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::zerosign reports $actual but $expected was requested"
            exit 1
          fi
          echo "verified zerosign $actual"

      - name: Package
        run: tar -czf "zerosign-${RELEASE_VERSION}-linux.tar.gz" zerosign

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerosign-linux
          path: zerosign-${{ inputs.version }}-linux.tar.gz

  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            perl
            curl
            tar
            patch
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib

      - name: Build
        run: mingw32-make compile win

      - name: Verify zero dependencies
        run: |
          ldd ./zerosign.exe
          if ldd ./zerosign.exe | grep -Ei '/(ucrt64|mingw64|clang64)/'; then
            echo "::error::zerosign.exe links a toolchain DLL"
            exit 1
          fi

      - name: Verify version
        shell: pwsh
        run: |
          $output = & .\zerosign.exe --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "zerosign.exe failed to start"
            exit 1
          }
          $actual = ($output -split '\s+')[1]
          $expected = "${{ inputs.version }}" -replace '^v', ''
          if ($actual -ne $expected) {
            Write-Error "zerosign reports $actual but $expected was requested"
            exit 1
          }
          Write-Host "verified zerosign $actual"

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path zerosign.exe -DestinationPath "zerosign-${{ inputs.version }}-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerosign-windows
          path: zerosign-${{ inputs.version }}-windows.zip

  publish:
    name: Publish release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: zerosign ${{ inputs.version }}
          generate_release_notes: true
          files: |
            artifacts/zerosign-${{ inputs.version }}-macos.tar.gz
            artifacts/zerosign-${{ inputs.version }}-linux.tar.gz
            artifacts/zerosign-${{ inputs.version }}-windows.zip